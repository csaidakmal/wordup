<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WordUp - Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'Poppins',sans-serif;color:#fff;background:#23262d;display:flex;flex-direction:column;align-items:center;padding:20px}
.top{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.logo{font-size:26px;font-weight:800;color:#fff;text-decoration:none}
.who{display:flex;gap:10px;align-items:center;font-size:14px;opacity:.9}
button{font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:8px 16px;border-radius:30px;border:2px solid #fff;background:transparent;color:#fff}
h2{width:100%;max-width:760px;margin:10px 0 0;font-size:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:16px;width:100%;max-width:760px}
.tile{position:relative;height:130px;border-radius:20px;padding:16px;display:flex;align-items:flex-end;font-size:24px;font-weight:800;color:#fff;text-decoration:none;box-shadow:0 5px 0 rgba(0,0,0,.3);overflow:hidden}
.tile i{position:absolute;right:16px;top:10px;font-style:normal;font-size:60px;opacity:.65}
.tile:hover{transform:translateY(-2px)}
</style>
</head>
<body>
<div class="top">
  <a class="logo" href="index.html">WordUp</a>
  <div class="who"><span id="who"></span><button id="out">Log out</button></div>
</div>
<h2>What do you want to do?</h2>
<div class="grid">
  <a class="tile" href="flashcards.html" style="background:linear-gradient(135deg,#6a6cff,#a000ff)"><i>🃏</i>Flashcards</a>
  <a class="tile" href="games.html" style="background:linear-gradient(135deg,#1bc0ff,#3b5bff)"><i>🎮</i>Word games</a>
  <a class="tile" href="translator.html" style="background:linear-gradient(135deg,#d4ff1a,#00d84a)"><i>🌍</i>Translator</a>
  <a class="tile" href="pronunciation.html" style="background:linear-gradient(135deg,#ff9a3c,#ff2a2a)"><i>🎤</i>Pronunciation</a>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const app = initializeApp({
  apiKey: "AIzaSyAV6qkvP5q93qVIeV08S0thfQBvTaHpdSM",
  authDomain: "wordup-4d379.firebaseapp.com",
  projectId: "wordup-4d379",
  storageBucket: "wordup-4d379.firebasestorage.app",
  messagingSenderId: "455344744711",
  appId: "1:455344744711:web:d34a93ccb5e572d708fda2"
});
const auth = getAuth(app);
onAuthStateChanged(auth, u => {
  if (!u) { location.href = 'login.html'; return; }
  document.getElementById('who').textContent = u.email;
});
document.getElementById('out').onclick = () => signOut(auth);
</script>
</body>
</html>
